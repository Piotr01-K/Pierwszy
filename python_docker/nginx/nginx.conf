events {}

http {
    server {
        listen 80;

        # 🔁 Reverse proxy do backendu
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 📦 Statyczne pliki
        location /static/ {
            alias /static/;
        }
    }
}